name: Validate Agent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: node --check app.js
      - run: node --check api/health.js
      - run: node --check api/research.js
      - run: node --check api/scan.js
      - run: node --check api/research-status.js
      - run: node --check api/lib/evidence.js
      - run: node --check api/lib/scoring.js
      - run: node --check api/lib/mock-connectors.js
      - run: node --check api/lib/rdap.js
      - run: node --check api/lib/news.js
      - run: node --check api/news.js
      - run: node --check api/agent.js
      - run: node --check api/lib/agent.js

      - run: node -e "JSON.parse(require('fs').readFileSync('data/domains.json','utf8')); JSON.parse(require('fs').readFileSync('data/buyer-research.json','utf8')); JSON.parse(require('fs').readFileSync('data/market-signals.json','utf8')); JSON.parse(require('fs').readFileSync('data/opportunities.json','utf8')); JSON.parse(require('fs').readFileSync('data/decision-makers.json','utf8')); JSON.parse(require('fs').readFileSync('data/outreach.json','utf8')); JSON.parse(require('fs').readFileSync('data/agent-memory.json','utf8')); JSON.parse(require('fs').readFileSync('data/research-jobs.json','utf8')); JSON.parse(require('fs').readFileSync('data/events.json','utf8')); JSON.parse(require('fs').readFileSync('data/agent-rules.json','utf8')); JSON.parse(require('fs').readFileSync('data/valuation-model.json','utf8')); JSON.parse(require('fs').readFileSync('data/connectors.json','utf8')); JSON.parse(require('fs').readFileSync('data/evidence-schema.json','utf8')); JSON.parse(require('fs').readFileSync('data/portfolio-metrics.json','utf8'));"

      - name: Production API smoke test
        run: |
          node - <<'NODE'
          const checks = [
            {
              name: "health",
              url: "https://robotintelligence.bot/api/health",
              validate: async (r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const j = await r.json();
                if (j.ok !== true) throw new Error("Health check returned ok=false");
                if (j.service !== "robot-intelligence-research-api") {
                  throw new Error("Unexpected service: " + j.service);
                }
              }
            },
            {
              name: "news",
              url: "https://robotintelligence.bot/api/news?q=Skild%20AI&maxrecords=1",
              validate: async (r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const j = await r.json();
                if (!j || typeof j !== "object") throw new Error("News response is not JSON");
                if (!j.connector || j.connector !== "gdelt") throw new Error("Unexpected news connector");
                if (!Array.isArray(j.articles)) throw new Error("News articles array missing");
              }
            },
            {
              name: "agent",
              url: "https://robotintelligence.bot/api/agent",
              validate: async (r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const j = await r.json();
                if (j.ok !== true) throw new Error("Agent endpoint returned ok=false");
                if (j.agent?.status !== "active") throw new Error("Agent is not active");
                if (!Array.isArray(j.agent?.domains) || j.agent.domains.length !== 3) {
                  throw new Error("Agent batch is invalid");
                }
              }
            },
            {
              name: "valuation",
              url: "https://robotintelligence.bot/api/valuation?domain=RobotIntelligence.bot",
              validate: async (r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const j = await r.json();
                if (j.ok !== true) throw new Error("Valuation returned ok=false");
                if (!j.value_state) throw new Error("Valuation value_state missing");
                if (!j.methodology) throw new Error("Valuation methodology missing");
              }
            }
          ];

          for (const check of checks) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
              const response = await fetch(check.url, {
                headers: { Accept: "application/json" },
                signal: controller.signal
              });
              await check.validate(response);
              console.log(`Production API ${check.name}: OK`);
            } finally {
              clearTimeout(timer);
            }
          }
          NODE
