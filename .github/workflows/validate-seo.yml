name: Validate SEO metadata and sitemap

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate sitemap targets and canonical metadata
        run: |
          python - <<'PY'
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap = ET.parse(root / "sitemap.xml").getroot()
          urls = [node.text.strip() for node in sitemap.findall("sm:url/sm:loc", ns)]
          assert urls, "Sitemap is empty"
          assert len(urls) == len(set(urls)), "Duplicate sitemap URLs"

          home_html = (root / "index.html").read_text(encoding="utf-8")
          radar_url = "https://robotintelligence.bot/buyer-radar.html"
          assert radar_url in urls, "Buyer Radar must remain in the sitemap"
          radar_links = re.findall(r'<a\b[^>]*href=["\']buyer-radar\.html["\']', home_html, re.I)
          assert len(radar_links) >= 2, "Homepage must expose Buyer Radar in navigation and the hero CTA"

          radar_html = (root / "buyer-radar.html").read_text(encoding="utf-8")
          radar_canonical = re.search(r"""<link\s+rel=["']canonical["']\s+href=["']([^"']+)""", radar_html, re.I)
          radar_robots = re.search(r"""<meta\s+name=["']robots["']\s+content=["']([^"']+)""", radar_html, re.I)
          assert radar_canonical and radar_canonical.group(1) == radar_url, "Buyer Radar canonical mismatch"
          assert radar_robots and "noindex" not in radar_robots.group(1).lower(), "Buyer Radar must remain indexable"

          assert (root / "sitemap").read_bytes() == (root / "sitemap.xml").read_bytes(), "Submitted sitemap endpoint must match sitemap.xml"

          for url in urls:
              assert url.startswith("https://robotintelligence.bot/"), f"Unexpected sitemap host: {url}"
              path = url.removeprefix("https://robotintelligence.bot/")
              target = root / (path or "index.html")
              assert target.is_file(), f"Sitemap target does not exist: {url}"
              html = target.read_text(encoding="utf-8")
              title = re.search(r"<title>(.*?)</title>", html, re.I | re.S)
              description = re.search(r"""<meta\s+name=["']description["']\s+content=["']([^"']+)""", html, re.I)
              canonical = re.search(r"""<link\s+rel=["']canonical["']\s+href=["']([^"']+)""", html, re.I)
              assert title and title.group(1).strip(), f"Missing title: {url}"
              assert description and len(description.group(1).strip()) >= 70, f"Missing/short description: {url}"
              assert canonical and canonical.group(1).rstrip("/") == url.rstrip("/"), f"Canonical mismatch: {url}"

          alias = (root / "agent/index.html").read_text(encoding="utf-8")
          alias_canonical = re.search(r"""<link\s+rel=["']canonical["']\s+href=["']([^"']+)""", alias, re.I)
          assert alias_canonical and alias_canonical.group(1) == "https://robotintelligence.bot/agent.html", "Agent alias must canonicalize to agent.html"
          assert "https://robotintelligence.bot/agent/" not in urls, "Duplicate agent alias must not be in sitemap"
          print(f"Validated {len(urls)} sitemap URLs and canonical metadata.")
          PY
      - name: Validate Buyer Radar scoring and outreach safeguards
        run: python .github/scripts/test_buyer_radar_methodology.py
      - name: Validate responsive mobile navigation and keyboard access
        run: python .github/scripts/test_mobile_navigation.py
